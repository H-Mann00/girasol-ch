# Homepage
hero_subtitle: Bossa Nova, Jazz & Pop Music Group
about_text: Gira Sol – bestehend aus Tobias, Helena und Elias – bringt warmherzige Bossa Nova, Jazz und Pop an jeden Ort. Wir schaffen eine gemütliche Atmosphäre, die zum Entspannen und Tanzen einlädt. Mit sorgfältig ausgewählten Songs und feinfühligem Spiel bieten wir das perfekte musikalische Begleitung für Hochzeiten, Feiern, private Events und mehr. Unser Ziel ist es, unvergessliche Momente zu erschaffen.
